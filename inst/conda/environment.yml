# Main nanoflow tool environment (bioconda). Install with:
#   conda env create -f environment.yml    (or: mamba env create -f ...)
#   conda activate nanoflow
#
# Notes
# - dorado and guppy are NOT on bioconda: ONT distributes them at
#   https://github.com/nanoporetech/dorado (and guppy via the ONT community
#   site; guppy is deprecated). Install separately on GPU nodes and/or set
#   config tools: dorado: /path/to/dorado.
# - hap.py needs Python 2.7 and cannot share this environment; it has its
#   own file, environment-happy.yml. Point config tools: happy at that
#   environment's hap.py (or let check_tools() find it on PATH).
# - Badread and ART are development-only (synthetic data generation under
#   data-raw/); they are deliberately NOT dependencies of the package.
# - If a pinned version has been dropped from bioconda on your platform,
#   relax that single pin rather than removing the tool.
name: nanoflow
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  # --- read QC / trimming ---
  - nanoplot=1.42.0
  - pycoqc=2.5.2
  - fastqc=0.12.1
  - porechop=0.2.4
  - filtlong=0.2.1
  - multiqc=1.21
  # --- alignment ---
  - minimap2=2.28
  - bwa=0.7.18
  - samtools=1.20
  - qualimap=2.3
  # --- assembly + polishing + assessment ---
  - flye=2.9.4
  - canu=2.2
  - wengan=0.2
  - racon=1.5.0
  - medaka=1.11.3
  - quast=5.2.0
  # --- variant calling ---
  - clair3=1.0.10
  - sniffles=2.8.1
  - svim=2.0.0
  - nanovar=1.8.1
  - survivor=1.0.7
  - spectre-cnv=0.2.1
  - mosdepth=0.3.8        # coverage input for Spectre
  # --- phasing ---
  - whatshap=2.3
  - hapcut2=1.3.4
  # --- annotation + benchmarking ---
  - snpeff=5.2
  - annotsv=3.4
  - truvari=4.3.1
  # --- reporting ---
  - igv-reports=1.12.0
  # --- core helpers ---
  - htslib=1.20           # bgzip + tabix
  # --- R runtime for the package itself (optional if R is system-wide) ---
  - r-base>=4.1
  - r-yaml
  - r-jsonlite
  - r-rmarkdown
  - r-knitr
  - r-testthat
  - pandoc
